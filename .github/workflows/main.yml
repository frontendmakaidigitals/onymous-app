name: Server Deployment

on:
  push:
    branches: [production, staging, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Create .env file
        run: |
          {
            echo "NODE_ENV=production"
            echo "PORT=${{ secrets.APP_PORT }}"
            echo "REDIS_PORT=${{ vars.REDIS_PORT }}"
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}"
            echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
            echo "DASHBOARD_ORIGINS=${{ vars.DASHBOARD_ORIGINS }}"
            echo "MSG91_AUTH_KEY=${{ secrets.MSG91_AUTH_KEY }}"
            echo "MSG91_WHATSAPP_NUMBER=${{ secrets.MSG91_WHATSAPP_NUMBER }}"
            echo "MSG91_WHATSAPP_NAMESPACE=${{ secrets.MSG91_WHATSAPP_NAMESPACE }}"
            echo "FP_SECRET_API_KEY=${{ secrets.FP_SECRET_API_KEY }}"
          } > .env

      - name: Install dependencies
        run: npm ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Create tarball
        run: |
          tar --exclude='./node_modules' \
            --exclude='.git' \
            --exclude='uploads' \
            -czf deploy.tar.gz . || [ $? -eq 1 ]

      - name: Copy tarball to server
        run: |
          scp -i ~/.ssh/id_ed25519 -P 22 \
            -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=10 \
            deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}/deploy.tar.gz

      - name: Extract, install & restart on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.APP_PATH }}
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            npm ci --omit=dev --ignore-scripts

            cat > ecosystem.config.cjs << 'CFG'
          module.exports = {
            apps: [{
              name: 'onymous-app',
              script: 'dist/server.js',
              cwd: __dirname,
              env: { NODE_ENV: 'production' },
            }],
          };
          CFG

            /usr/local/bin/pm2 restart ecosystem.config.cjs --update-env || \
            /usr/local/bin/pm2 start ecosystem.config.cjs
            /usr/local/bin/pm2 save
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            sleep 5

            if ! /usr/local/bin/pm2 describe onymous-app | grep -q "status.*online"; then
              echo "PM2 process 'onymous-app' is not online"
              /usr/local/bin/pm2 logs onymous-app --lines 50 --nostream
              exit 1
            fi

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ secrets.APP_PORT }})
            if [ "$STATUS" -ge 500 ] || [ "$STATUS" -eq 000 ]; then
              echo "Health check failed, HTTP status: $STATUS"
              /usr/local/bin/pm2 logs onymous-app --lines 50 --nostream
              exit 1
            fi
            echo "App is up, HTTP status: $STATUS"
          EOF
